# Lagoon deployment manifest.
#
# This file is not meant to be run locally: development happens without Docker,
# through `pnpm dev`. Lagoon reads it to know which services to create and which
# image to build for each one (the `lagoon.*` labels).

services:
  # Payload CMS. `node` exposes port 3000 and gets a public route.
  cms:
    build:
      context: .
      dockerfile: lagoon/cms.dockerfile
    labels:
      lagoon.type: node
    depends_on:
      - postgres

  # Static Astro site. `node-persistent` because the contents of /app/dist are
  # produced after deployment, by the post-rollout task: they have to survive pod
  # restarts.
  web:
    build:
      context: .
      dockerfile: lagoon/web.dockerfile
    labels:
      lagoon.type: node-persistent
      lagoon.persistent: /app/dist
      lagoon.persistent.size: 1Gi

  # Meta type: Lagoon picks `postgres-single` in development and `postgres-dbaas`
  # in production when the cluster exposes a DBaaS operator.
  #
  # TODO (deployment): untested — this pass only covers local development. The
  # variables Lagoon injects still have to be mapped in
  # apps/cms/src/lib/databaseUri.ts, and Payload needs real migrations rather
  # than the dev adapter's `push`.
  postgres:
    image: uselagoon/postgres-17:latest
    labels:
      lagoon.type: postgres
