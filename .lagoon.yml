docker-compose-yaml: docker-compose.yml

# Injects LAGOON_GIT_SHA into the containers, handy for tracing a build.
environment_variables:
  git_sha: 'true'

tasks:
  # Lagoon builds images before deploying them. At `docker build` time neither
  # the CMS nor the database is reachable, so the static site cannot be generated
  # there. It is generated here, after the rollout, once every service answers on
  # its internal name.
  post-rollout:
    - run:
        name: Prepare the database and, in dev, seed demo content
        service: cms
        shell: bash
        command: |
          set -e
          # Creates the collections and builds their indexes outside a
          # transaction: without this the very first write against a fresh
          # database fails on a lock conflict (see
          # src/seed/ensureCollections.ts).
          pnpm --filter cms db:prepare

          # The seed goes through Payload's local API: it needs the database, not
          # the HTTP server. It is idempotent, and only creates an administrator
          # when the users collection is empty.
          if [ "$LAGOON_ENVIRONMENT_TYPE" = "development" ]; then
            pnpm --filter cms seed
          else
            echo "Production environment: skipping seed."
          fi

    - run:
        name: Wait for the CMS to answer
        service: web
        shell: bash
        command: |
          set -e
          for attempt in $(seq 1 60); do
            if curl -sf -X POST http://cms:3000/api/graphql \
                 -H 'Content-Type: application/json' \
                 -d '{"query":"{ __typename }"}' > /dev/null; then
              echo "CMS ready after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 5
          done
          echo "The CMS did not answer within 5 minutes." >&2
          exit 1

    - run:
        name: Build and publish the static site
        service: web
        shell: bash
        command: |
          set -e
          export PAYLOAD_GRAPHQL_URL="http://cms:3000/api/graphql"
          export SITE_URL="${LAGOON_ROUTE}"
          # The home page links to the admin panel. Lagoon does not hand the
          # `cms` route to the `web` service, so NEXT_PUBLIC_SERVER_URL — the
          # variable the CMS already needs — has to be set as a project
          # variable; without it the link is simply omitted.
          pnpm --filter web build

          # Publish in two steps rather than `rm -rf` on the served volume: a
          # copy that fails halfway must not leave a half-filled directory
          # exposed.
          rm -rf /app/dist.incoming
          cp -R apps/web/dist /app/dist.incoming
          rm -rf /app/dist/*  /app/dist/.[!.]* 2>/dev/null || true
          cp -R /app/dist.incoming/. /app/dist/
          rm -rf /app/dist.incoming

          echo "Published: $(find /app/dist -name '*.html' | wc -l) page(s)."

environments:
  # Production.
  main:
    monitoring_urls:
      - 'docs.example.com'
    routes:
      - web:
          - 'docs.example.com':
              tls-acme: true
              insecure: Redirect
      - cms:
          - 'admin.docs.example.com':
              tls-acme: true
              insecure: Redirect

  # Shared development environment. The seed runs automatically here.
  develop:
    routes:
      - web:
          - 'develop.docs.example.com':
              tls-acme: true
              insecure: Redirect
      - cms:
          - 'admin.develop.docs.example.com':
              tls-acme: true
              insecure: Redirect
