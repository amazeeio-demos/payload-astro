docker-compose-yaml: docker-compose.yml

# Injects LAGOON_GIT_SHA into the containers, handy for tracing a build.
environment_variables:
  git_sha: 'true'

# Every URL the services need is read off LAGOON_ROUTES at runtime (see
# apps/cms/src/lib/lagoonRoutes.ts and apps/web/src/site.ts), so an environment
# needs no URL variable. The secrets are project variables — see the README.
tasks:
  # Lagoon builds images before deploying them. At `docker build` time neither
  # the CMS nor the database is reachable, so the static site cannot be generated
  # there. It is generated here, after the rollout, once every service answers on
  # its internal name. Until then the `web` pod serves a 503 placeholder
  # (lagoon/web-entrypoint.mjs). The Lagoon node images have no curl, hence the
  # node scripts for the waits.
  post-rollout:
    - run:
        name: Seed a blank database
        service: cms
        shell: sh
        command: |
          set -e
          # This runs inside the cms pod, which applies the migrations while it
          # boots. Wait for it to answer so the seed never races them.
          node lagoon/wait-for-http.mjs http://localhost:3000/api/access
          # First install only: creates the administrator (SEED_ADMIN_*), the
          # preview user (PREVIEW_API_KEY) and the demo pages. A database with any
          # user in it is left alone.
          pnpm --filter cms seed --if-empty

    - run:
        name: Build and publish the site
        service: web
        shell: sh
        command: |
          set -e
          export PAYLOAD_GRAPHQL_URL="${PAYLOAD_GRAPHQL_URL:-http://cms:3000/api/graphql}"
          node lagoon/wait-for-http.mjs http://cms:3000/api/access
          # Build on the volume next to the served directories, then move them
          # into place: a directory rename is atomic, so the server entry never
          # shows up before the rest of its bundle, and a build that fails
          # halfway leaves the current site untouched. Static pages refresh at
          # once; the preview server's own bundle on the next pod start.
          dist=/app/apps/web/dist
          rm -rf "$dist/.incoming"
          pnpm --filter web exec astro build --outDir "$dist/.incoming"
          rm -rf "$dist/client" "$dist/server"
          mv "$dist/.incoming/client" "$dist/.incoming/server" "$dist/"
          rm -rf "$dist/.incoming"
          echo "Published: $(find "$dist/client" -name '*.html' | wc -l) page(s)."

# Routes are autogenerated: https://<service>.<project>-<environment>.<cluster>.
# Custom domains go under `environments.<name>.routes`, the site first so it stays
# the main route, and then NEXT_PUBLIC_SERVER_URL / SITE_URL should be set as
# environment variables since the hostname convention no longer holds.
environments:
  prod:
    autogenerateRoutes: true
  dev:
    autogenerateRoutes: true
